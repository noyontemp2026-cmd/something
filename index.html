<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffdae5">
  <title>A Little Love ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="hearts-background" id="hearts"></div>

  <!-- Welcome Screen -->
  <section class="screen active" id="welcomeScreen">
    <div class="popup">
      <div class="love-icon">💗</div>

      <h1>আপনি কি শুরু করতে চান?</h1>
      <p>একটু ভালোবাসার গল্প শুরু হোক... 🥺</p>

      <button id="startBtn">
        হ্যাঁ, শুরু করি ❤️
      </button>
    </div>
  </section>

  <!-- Message Screen -->
  <section class="screen" id="messageScreen">
    <div class="message-box">
      <div class="big-heart">❤️</div>
      <h1 id="typewriter"></h1>
      <div class="small-hearts">💕 💗 💖</div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
